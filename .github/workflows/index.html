
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10151c;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      background: #1b2634;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; color: #55d6be; }
    .status { color: #55d6be; font-size: 13px; }
    main { padding: 20px; }
    .clock {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }
    .subtitle { color: #aab6c5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }
    .tile {
      background: #202b39;
      border: 1px solid #354458;
      border-radius: 18px;
      min-height: 125px;
      padding: 20px 12px;
      text-align: center;
      color: white;
      font-size: 17px;
    }
    .tile span {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }
    .tile:active { background: #304456; }
    footer {
      text-align: center;
      padding: 25px;
      color: #8998aa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CarOS</h1>
    <div class="status">● SYSTEM READY</div>
  </header>
  <main>
    <p class="subtitle">Selamat memandu</p>
    <div class="clock" id="clock">--:--</div>
    <p class="subtitle" id="date"></p>
    <div class="grid">
      <button class="tile" onclick="showMessage('FM Radio')">
        <span>📻</span>FM Radio
      </button>
      <button class="tile" onclick="showMessage('Bluetooth')">
        <span>ᛒ</span>Bluetooth
      </button>
      <button class="tile" onclick="showMessage('Music Player')">
        <span>🎵</span>Music Player
      </button>
      <button class="tile" onclick="showMessage('Video Player')">
        <span>🎬</span>Video Player
      </button>
      <button class="tile" onclick="showMessage('Play Store')">
        <span>▶️</span>Play Store
      </button>
      <button class="tile" onclick="showMessage('Android Auto')">
        <span>🚘</span>Android Auto
      </button>
    </div>
    <p id="message" style="text-align:center;color:#55d6be"></p>
  </main>
  <footer>CarOS Prototype v0.4</footer>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('ms-MY', {
          hour: '2-digit', minute: '2-digit'
        });
      document.getElementById('date').textContent =
        now.toLocaleDateString('ms-MY', {
          weekday: 'long', day: 'numeric', month: 'long'
        });
    }
    function showMessage(name) {
      document.getElementById('message').textContent =
        name + ' — fungsi belum disambungkan.';
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
