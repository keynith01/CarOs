name: Build CarOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking CarOS project files..."
          ls -la
          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing."
            echo "Upload the CarOS web files before building the APK."
            exit 1
          fi
          echo "CarOS index.html found."
          
