
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarOS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #10151c;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      background: #1b2634;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; color: #55d6be; }
    .status { color: #55d6be; font-size: 13px; }
    main { padding: 20px; }
    .clock {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }
    .subtitle { color: #aab6c5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }
    .tile {
      background: #202b39;
      border: 1px solid #354458;
      border-radius: 18px;
      min-height: 125px;
      padding: 20px 12px;
      text-align: center;
      color: white;
      font-size: 17px;
    }
    .tile span {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }
    .tile:active { background: #304456; }
    footer {
      text-align: center;
      padding: 25px;
      color: #8998aa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CarOS</h1>
    <div class="status">● SYSTEM READY</div>
  </header>
  <main>
    <p class="subtitle">Selamat memandu</p>
    <div class="clock" id="clock">--:--</div>
    <p class="subtitle" id="date"></p>
    <div class="grid">
      <button class="tile" onclick="showMessage('FM Radio')">musi
        <span>📻</span>FM Radio
      </button>
      <button class="tile" onclick="showMessage('Bluetooth')">
        <span>ᛒ</span>Bluetooth
      </button>
      <button class="tile" onclick="openMusicPlayer()">
        <span>🎵</span>Music Player
      </button>
      <button class="tile" onclick="showMessage('Video Player')">
        <span>🎬</span>Video Player
      </button>
      <button class="tile" onclick="showMessage('Play Store')">
        <span>▶️</span>Play Store
      </button>
      <button class="tile" onclick="showMessage('Android Auto')">
        <span>🚘</span>Android Auto
      </button>
    </div>
    <p id="message" style="text-align:center;color:#55d6be"></p>
  </main>
  <footer>CarOS Prototype v0.4</footer>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('ms-MY', {
          hour: '2-digit', minute: '2-digit'
        });
      document.getElementById('date').textContent =
        now.toLocaleDateString('ms-MY', {
          weekday: 'long', day: 'numeric', month: 'long'
        });
    }
    function showMessage(name) {
      document.getElementById('message').textContent =
        name + ' — fungsi belum disambungkan.';
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
  
<script>
async function openMusicPlayer() {
  let player = document.getElementById('musicPlayer');

  if (!player) {
    player = document.createElement('div');
    player.id = 'musicPlayer';
    player.style.cssText =
      'position:fixed;inset:0;background:#101820;color:white;' +
      'z-index:9999;padding:24px;overflow:auto;font-family:Arial;';

    player.innerHTML = `
      <button id="closeMusic"
        style="padding:10px;background:#263238;color:white;border:0;border-radius:8px">
        ← Dashboard
      </button>
      <h2>🎵 Music Player</h2>
      <p id="musicStatus">Bersedia untuk imbas lagu...</p>
      <audio id="musicAudio" controls style="width:100%"></audio>
      <div id="musicList"></div>
    `;

    document.body.appendChild(player);
    document.getElementById('closeMusic').onclick =
      () => player.remove();
  }

  const status = document.getElementById('musicStatus');
  const list = document.getElementById('musicList');

  try {
    const store = window.CapacitorMediaStore;
    if (!store) {
      status.textContent =
        'Plugin muzik belum dapat diakses. Kita perlu semak sambungan plugin.';
      return;
    }

    status.textContent = 'Meminta kebenaran akses muzik...';
    await store.requestPermissions({ types: ['audio'] });

    status.textContent = 'Sedang mengimbas lagu...';

    const result = await store.getMediasByType({
      mediaType: 'audio',
      sortBy: 'TITLE',
      includeExternal: true
    });

    const songs = result.media || [];
    list.replaceChildren();

    if (!songs.length) {
      status.textContent = 'Tiada fail muzik ditemui dalam telefon.';
      return;
    }

    status.textContent = songs.length + ' lagu ditemui';

    songs.forEach(song => {
      const item = document.createElement('button');
      item.style.cssText =
        'display:block;width:100%;padding:14px;margin:8px 0;' +
        'text-align:left;background:#263238;color:white;' +
        'border:0;border-radius:10px';

      item.textContent =
        (song.title || song.displayName || 'Lagu tanpa tajuk') +
        ' — ' + (song.artist || 'Artis tidak diketahui');

      item.onclick = async () => {
        const audio = document.getElementById('musicAudio');
        audio.src = song.uri;
        try {
          await audio.play();
        } catch (error) {
          status.textContent =
            'Lagu dipilih, tetapi playback gagal. Kita akan semak URI audio.';
        }
      };

      list.appendChild(item);
    });
  } catch (error) {
    status.textContent = 'Ralat imbasan: ' +
      (error.message || String(error));
  }
}
</script>
<script src="music-player.bundle.js"></script>
</body>
</html>
